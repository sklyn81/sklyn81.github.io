<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Planner Choi Sung Keun | Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        :root {
            --bg-main: #0a0e17;
            --sidebar-bg: #151c2c;
            --accent: #3b82f6;
            --close-bg: #ef4444; 
            --line-color: #cbd5e1; /* 이미지의 회색 선 느낌 */
            --text-p: #ffffff;
            --text-s: #94a3b8;
            --glass: rgba(255, 255, 255, 0.05);
            --sidebar-width: 320px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg-main); color: var(--text-p); display: flex; height: 100vh; overflow: hidden; }

        /* 커스텀 토글 버튼 (이미지 디자인 반영) */
        .menu-toggle {
            position: fixed; top: 20px; left: 20px; z-index: 1001;
            background: var(--close-bg); /* 열려있을 때 빨간색 */
            border: none; width: 50px; height: 50px; border-radius: 12px;
            cursor: pointer; display: flex; flex-direction: row; /* 기본 세로줄 배치 */
            align-items: center; justify-content: center; gap: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 버튼 내부의 3개 선 */
        .menu-toggle span {
            display: block; width: 4px; height: 24px; /* 세로줄 형태 */
            background: var(--line-color); border-radius: 10px;
            transition: all 0.4s ease;
        }

        /* 사이드바가 닫혔을 때 (파란색 배경 + 가로줄 3개) */
        body.sidebar-closed .menu-toggle {
            background: var(--accent);
            flex-direction: column; /* 가로줄 배치를 위해 컬럼으로 변경 */
        }
        body.sidebar-closed .menu-toggle span {
            width: 24px; height: 4px; /* 가로줄 형태로 변경 */
        }

        /* 사이드바 애니메이션 및 스타일 */
        nav {
            width: var(--sidebar-width); background: var(--sidebar-bg); padding: 85px 20px 30px;
            display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; flex-shrink: 0; z-index: 1000;
        }
        body.sidebar-closed nav { margin-left: calc(var(--sidebar-width) * -1); opacity: 0; }

        .profile-area { text-align: center; margin-bottom: 30px; }
        .profile-img { width: 120px; height: 150px; border-radius: 10px; object-fit: cover; border: 2px solid var(--accent); margin-bottom: 15px; }

        .contact-box { background: var(--glass); padding: 15px; border-radius: 10px; font-size: 0.85rem; text-align: left; }
        .contact-box div { margin-bottom: 8px; color: var(--accent); font-weight: bold; }
        .contact-box span { color: var(--text-p); }

        nav button {
            width: 100%; text-align: left; padding: 14px 15px; background: none; border: none;
            color: var(--text-s); cursor: pointer; transition: 0.3s; font-size: 0.95rem; border-radius: 8px;
            display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
        }
        nav button:hover { background: rgba(255,255,255,0.08); color: #fff; }
        nav button.active { background: var(--accent); color: #fff; }

        /* 메인 콘텐츠 영역 */
        main { flex: 1; padding: 40px 40px 40px 60px; overflow-y: auto; transition: 0.4s; }
        body.sidebar-closed main { padding-left: 90px; }

        .content-section { display: none; animation: fadeIn 0.4s ease-out; max-width: 1100px; margin: 0 auto; }
        .content-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px; margin-top: 20px; }
        .gallery-item { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .gallery-item img { width: 100%; height: auto; display: block; }
        .gallery-desc { padding: 15px; font-size: 0.9rem; color: var(--text-s); }
    </style>
</head>
<body>

    <!-- 디자인이 변경된 토글 버튼 -->
    <button class="menu-toggle" onclick="toggleSidebar()" id="toggleBtn">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav id="sidebar">
        <div class="profile-area">
            <img src="thumbnail_img.png" alt="최성근" class="profile-img">
            <h3 style="margin-bottom: 10px;">최성근</h3>
            <div class="contact-box">
                <div>Email: <span>windcraw@naver.com</span></div>
                <div>Phone: <span>010-9101-9360</span></div>
            </div>
        </div>

        <div style="margin-top: 25px;">
            <button onclick="showPage('intro')" class="active" id="btn-intro">소개 및 역량</button>
            <button onclick="showPage('level3d')">레벨 & 콘텐츠 디자인</button>
            <button onclick="showPage('sys1')">시스템 기획</button>
            <button onclick="showPage('etc_proj')">그 외 프로젝트</button>
        </div>
    </nav>

    <main id="main-content">
        <section id="intro" class="content-section active">
            <h2>Introduction</h2>
            <div style="background: var(--glass); padding: 30px; border-radius: 15px; margin-top: 20px;">
                <p>20년 경력의 게임 플래너 최성근입니다.</p>
            </div>
        </section>

        <section id="level3d" class="content-section">
            <h2>레벨 & 콘텐츠 디자인</h2>
            <div class="gallery-grid">
                <div class="gallery-item"><img src="l_img/img_1.png"><div class="gallery-desc">레벨 디자인 예시 01</div></div>
                <div class="gallery-item"><img src="l_img/img_2.png"><div class="gallery-desc">레벨 디자인 예시 02</div></div>
            </div>
        </section>

        <!-- 시스템 기획 및 기타 섹션 생략 (동일한 구조) -->
    </main>

    <script>
        function toggleSidebar() {
            document.body.classList.toggle('sidebar-closed');
        }

        function showPage(id) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            if (window.innerWidth <= 1024) {
                document.body.classList.add('sidebar-closed');
            }
        }
    </script>
</body>
</html>
