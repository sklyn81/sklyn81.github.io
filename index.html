<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Planner Choi Sung Keun | Portfolio</title>
    <style>
        :root {
            --bg-main: #0a0e17;
            --sidebar-bg: #151c2c;
            --accent: #3b82f6;
            --close-bg: #ef4444; 
            --line-color: #cbd5e1;
            --text-p: #ffffff;
            --text-s: #94a3b8;
            --glass: rgba(255, 255, 255, 0.05);
            --sidebar-width: 300px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg-main); color: var(--text-p); display: flex; height: 100vh; overflow: hidden; }

        /* 커스텀 토글 버튼 (이미지 디자인 반영) */
        .menu-toggle {
            position: fixed; top: 20px; left: 20px; z-index: 1001;
            background: var(--close-bg); 
            border: none; width: 50px; height: 50px; border-radius: 12px;
            cursor: pointer; display: flex; flex-direction: row; 
            align-items: center; justify-content: center; gap: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .menu-toggle span {
            display: block; width: 4px; height: 24px; 
            background: var(--line-color); border-radius: 10px;
            transition: all 0.3s ease;
        }

        body.sidebar-closed .menu-toggle {
            background: var(--accent);
            flex-direction: column;
        }
        body.sidebar-closed .menu-toggle span {
            width: 24px; height: 4px;
        }

        /* 사이드바 */
        nav {
            width: var(--sidebar-width); background: var(--sidebar-bg); padding: 85px 20px 30px;
            display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; flex-shrink: 0; z-index: 1000;
        }
        body.sidebar-closed nav { margin-left: calc(var(--sidebar-width) * -1); opacity: 0; }

        .profile-area { text-align: center; margin-bottom: 30px; }
        .profile-img { width: 120px; height: 150px; border-radius: 10px; object-fit: cover; border: 2px solid var(--accent); margin-bottom: 15px; }

        .contact-box { background: var(--glass); padding: 15px; border-radius: 10px; font-size: 0.85rem; text-align: left; }
        .contact-box div { margin-bottom: 8px; color: var(--accent); font-weight: bold; }
        .contact-box span { color: var(--text-p); font-weight: normal; }

        .nav-group { margin-top: 25px; }
        nav button {
            width: 100%; text-align: left; padding: 14px 15px; background: none; border: none;
            color: var(--text-s); cursor: pointer; transition: 0.3s; font-size: 0.95rem; border-radius: 8px;
            display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
        }
        nav button:hover { background: rgba(255,255,255,0.08); color: #fff; }
        nav button.active { background: var(--accent); color: #fff; font-weight: bold; }

        /* 메인 콘텐츠 */
        main { flex: 1; padding: 40px 40px 40px 60px; overflow-y: auto; transition: 0.4s; position: relative; }
        body.sidebar-closed main { padding-left: 90px; }

        .content-section { display: none; animation: fadeIn 0.4s ease-out; max-width: 1100px; margin: 0 auto; }
        .content-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 2rem; margin-bottom: 25px; border-left: 5px solid var(--accent); padding-left: 15px; }
        .card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 15px; margin-bottom: 25px; line-height: 1.8; }
        
        /* 갤러리 그리드 */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px; margin-top: 20px; }
        .gallery-item { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .gallery-item img { width: 100%; height: auto; display: block; }
        .gallery-desc { padding: 15px; font-size: 0.9rem; color: var(--text-s); border-top: 1px solid rgba(255,255,255,0.05); }

        @media (max-width: 1024px) {
            .gallery-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <button class="menu-toggle" onclick="toggleSidebar()" id="toggleBtn">
        <span></span><span></span><span></span>
    </button>

    <nav id="sidebar">
        <div class="profile-area">
            <img src="thumbnail_img.png" alt="최성근" class="profile-img">
            <h3 style="margin-bottom: 10px;">최성근</h3>
            <div class="contact-box">
                <div>Email: <span>windcraw@naver.com</span></div>
                <div>Phone: <span>010-9101-9360</span></div>
            </div>
        </div>

        <div class="nav-group">
            <button onclick="showPage('intro')" class="active" id="btn-intro">소개 및 역량</button>
            <button onclick="showPage('level3d')" id="btn-level3d">레벨 & 콘텐츠 디자인</button>
            <button onclick="showPage('sys1')" id="btn-sys1">시스템 기획</button>
            <button onclick="showPage('etc_proj')" id="btn-etc_proj">그 외 프로젝트</button>
        </div>
    </nav>

    <main id="main-content">
        <!-- 1. 소개 섹션 -->
        <section id="intro" class="content-section active">
            <h2>Introduction</h2>
            <div class="card">
                <p>20년 경력의 게임 플래너 최성근입니다.</p>
                <p>유니티 및 언리얼 엔진 활용 능력을 기반으로 실무 기획의 완성도를 높입니다.</p>
            </div>
        </section>

        <!-- 2. 레벨 디자인 (l_img) -->
        <section id="level3d" class="content-section">
            <h2>레벨 & 콘텐츠 디자인</h2>
            <div class="gallery-grid">
                <div class="gallery-item"><img src="l_img/img_1.png"><div class="gallery-desc">레벨 디자인 실무 01</div></div>
                <div class="gallery-item"><img src="l_img/img_2.png"><div class="gallery-desc">레벨 디자인 실무 02</div></div>
            </div>
        </section>

        <!-- 3. 시스템 기획 (s_img) -->
        <section id="sys1" class="content-section">
            <h2>시스템 기획</h2>
            <div class="gallery-grid">
                <div class="gallery-item"><img src="s_img/img_12.png"><div class="gallery-desc">시스템 설계도 01</div></div>
            </div>
        </section>

        <!-- 4. 그 외 프로젝트 (e_img) -->
        <section id="etc_proj" class="content-section">
            <h2>그 외 프로젝트</h2>
            <div class="gallery-grid">
                <div class="gallery-item"><img src="e_img/c_img1.png"><div class="gallery-desc">기타 프로젝트 자료 01</div></div>
            </div>
        </section>
    </main>

    <script>
        // 사이드바 토글 함수
        function toggleSidebar() {
            document.body.classList.toggle('sidebar-closed');
        }

        // 페이지 전환 함수
        function showPage(pageId) {
            // 1. 모든 섹션 숨기기
            const sections = document.querySelectorAll('.content-section');
            sections.forEach(section => {
                section.classList.remove('active');
            });

            // 2. 선택한 섹션 보이기
            const activeSection = document.getElementById(pageId);
            if (activeSection) {
                activeSection.classList.add('active');
            }

            // 3. 모든 버튼 비활성화 및 클릭된 버튼 활성화
            const buttons = document.querySelectorAll('nav button');
            buttons.forEach(btn => {
                btn.classList.remove('active');
            });
            
            // 현재 클릭된 타겟 버튼 활성화
            if (event && event.currentTarget && event.currentTarget.tagName === 'BUTTON') {
                event.currentTarget.classList.add('active');
            } else {
                // 직접 ID로 활성화 (초기 로드 등)
                const targetBtn = document.getElementById('btn-' + pageId);
                if (targetBtn) targetBtn.classList.add('active');
            }

            // 4. 모바일/작은 화면일 경우 메뉴 클릭 시 사이드바 닫기 (선택 사항)
            if (window.innerWidth <= 1024) {
                document.body.classList.add('sidebar-closed');
            }

            // 5. 스크롤을 상단으로 이동
            document.getElementById('main-content').scrollTo(0, 0);
        }
    </script>
</body>
</html>
